[project]
name = "estudoconcurso"
version = "0.1.0"
description = "App pessoal de estudo para concursos (questoes importadas e geradas por IA)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "psycopg[binary]>=3.2",
    "markitdown>=0.0.1",
    "google-generativeai>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "black>=24.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
